  # generate platform-specific locks with `conda-lock -f environment.yml`.
  - python=3.12.12
  - rdkit=2025.09.5
  - openbabel=3.2.1
  - vina=1.2.7
  - meeko=0.8.0
  - fpocket=4.2.3
  - pdbfixer=1.12
  - openmm=8.6.1
  - biopython=1.88
  - scikit-learn=1.9.1
  - scipy=1.17.1
  - numpy=2.4.6
  - mdanalysis=2.11.0
  - pytest=9.2.0
  - ruff=0.17.4
  - mypy=2.4.1
  - pip=26.2.1
  - pip:
      - fastapi==0.162.2
      - uvicorn[standard]==0.54.0
      - celery==5.7.0
      - redis==8.1.0
      - sqlalchemy==2.1.8
      - alembic==1.20.1
      - pydantic==2.14.3
      - pydantic-settings==2.16.2
      - prolif==2.2.3
      - spyrmsd==0.9.0
      - weasyprint==70.0
      - psycopg[binary]==3.3.2
      - httpx==0.28.1
      - pytest-asyncio==1.3.0
