services:
  - type: web
    name: doclabs
    runtime: docker
    plan: free
    region: oregon
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DOCKLAB_USE_CELERY
        value: "0"
      - key: DATABASE_URL
        value: sqlite:////tmp/docklab.db
      - key: DATA_DIR
        value: /tmp/docklab-data
