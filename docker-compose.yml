services:
  postgres:
    image: postgres:16-alpine
    container_name: docklab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docklab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-docklab}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docklab} -d ${POSTGRES_DB:-docklab}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: docklab-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: docklab-api
    restart: unless-stopped
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - .:/workspace
      - docklab_data:/data
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-docklab}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-docklab}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DATA_DIR=/data
      - DOCKLAB_USE_CELERY=1
      - DEBUG=false
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: docklab-worker
    restart: unless-stopped
    command: ["celery", "-A", "backend.app.workers.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    volumes:
      - .:/workspace
      - docklab_data:/data
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-docklab}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-docklab}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DATA_DIR=/data
      - DOCKLAB_USE_CELERY=1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: docklab-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  docklab_data:

