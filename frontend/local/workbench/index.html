<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DockLab · Local Workbench</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;500&display=swap');
:root{font-family:Newsreader,Georgia,serif;color:#191a18;background:#f4f1e9;--muted:#696a63;--line:#d3d0c5;--accent:#a63a28}*{box-sizing:border-box}body{margin:0}button,input,select{font:12px 'IBM Plex Mono',monospace;color:inherit}button{padding:11px 14px;border:1px solid #191a182a;border-radius:10px;background:#ffffffa8;backdrop-filter:blur(16px);box-shadow:0 5px 18px #2221;cursor:pointer}button:hover{background:#fff;transform:translateY(-1px)}button:disabled{opacity:.45;cursor:wait}.shell{max-width:1160px;min-height:100vh;margin:auto;padding:0 34px;display:flex;flex-direction:column}.nav{height:72px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);font:11px 'IBM Plex Mono',monospace}.nav a{color:inherit;text-decoration:none;margin-left:18px}.brand{margin:0!important;letter-spacing:.08em}.brand span{color:var(--muted)}main{width:min(100%,900px);margin:0 auto;padding:56px 0 40px}.eyebrow{font:10px 'IBM Plex Mono',monospace;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}h1{font-size:clamp(52px,8vw,86px);font-weight:400;line-height:.98;letter-spacing:-.04em;margin:22px 0}h1 em{color:var(--muted)}h2{font-size:27px;font-weight:400;margin:0 0 14px}h2 span{font:12px 'IBM Plex Mono',monospace;color:var(--accent);margin-right:8px}h3{font-weight:400;font-size:20px}.lede,.muted{color:var(--muted);font-size:18px;max-width:650px}.glass{background:#ffffff8c;border:1px solid #191a1818;border-radius:14px;backdrop-filter:blur(18px);box-shadow:0 16px 48px #2221}.launch{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-top:38px;padding:22px}.launch select,.panel select,.panel input[type=text],.panel input[type=number]{padding:10px;border:1px solid var(--line);border-radius:8px;background:#f4f1e9a8}.launch select{display:block;min-width:300px;margin-top:10px}.quiet{border:0;background:transparent;box-shadow:none;color:var(--muted)}.method{border-top:1px solid var(--line);margin-top:65px;padding-top:18px;color:var(--muted)}section{border-bottom:1px solid var(--line);padding:28px 0;scroll-margin-top:20px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.panel{padding:18px;border:1px solid var(--line);border-radius:12px;background:#fff7}.panel>*{max-width:100%}.panel button{margin:8px 6px 0 0}.panel input[type=file]{display:block;margin-top:12px;max-width:100%}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:650px}.fields label{font:10px 'IBM Plex Mono',monospace;color:var(--muted);text-transform:uppercase}.fields input{display:block;width:100%;margin-top:5px;padding:9px;background:#fff8;border:1px solid var(--line);border-radius:7px}.viewer{height:390px;border:1px solid var(--line);border-radius:12px;background:#faf9f4;overflow:hidden}.protein-hit{display:block;width:100%;text-align:left;margin:8px 0!important}.hit-meta{font:10px 'IBM Plex Mono',monospace;color:var(--muted);line-height:1.6}.structure-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;align-items:start}.ligand-drawing{min-height:180px;border:1px solid var(--line);border-radius:10px;background:#fff9;display:grid;place-items:center;margin-top:12px}.ligand-drawing img{max-width:100%;height:auto}.target-card{margin-top:16px}.target-card a{font:10px 'IBM Plex Mono',monospace;color:var(--accent)}.case-explainer{margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:9px;background:#f4f1e9a8}.case-explainer p{margin-bottom:0;color:var(--muted);font-size:14px}.protein-search-note{font:11px 'IBM Plex Mono',monospace;color:var(--muted)}@media(max-width:760px){.structure-grid{grid-template-columns:1fr}}.viewer canvas{width:100%;height:100%;touch-action:none;cursor:grab}.viewer canvas:active{cursor:grabbing}.list{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.list article{padding:17px;border:1px solid var(--line);border-radius:11px}.stats{font:11px 'IBM Plex Mono',monospace;color:var(--muted)}.msg{min-height:24px;color:var(--accent);font:12px 'IBM Plex Mono',monospace}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;font:11px 'IBM Plex Mono',monospace;text-align:left}th,td{padding:10px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:9px;font-weight:400;text-transform:uppercase}.row{cursor:pointer}.row:hover{background:#a63a2810}.links{display:flex;gap:18px;flex-wrap:wrap;margin:18px 0}.links a{font:11px 'IBM Plex Mono',monospace;color:var(--accent)}.checks{border-top:1px solid var(--line)}.check{display:grid;grid-template-columns:80px 1fr;gap:10px;border-bottom:1px solid var(--line);padding:12px 0}.report{white-space:pre-wrap;overflow:auto;max-height:280px;background:#fff8;padding:12px;font-size:11px}footer{display:flex;justify-content:space-between;gap:18px;border-top:1px solid var(--line);margin-top:auto;padding:18px 0;color:var(--muted);font:10px 'IBM Plex Mono',monospace}.hidden{display:none!important}@media(max-width:640px){.shell{padding:0 17px}.launch{align-items:stretch;flex-direction:column}.launch select{min-width:0;width:100%}.grid,.list{grid-template-columns:1fr}.fields{grid-template-columns:repeat(2,1fr)}footer{flex-direction:column}main{padding-top:35px}}
</style></head><body><div class="shell"><header class="nav"><a class="brand" href="/">DOCKLAB <span>/ LOCAL SCIENCE WORKBENCH</span></a><div><a href="/" onclick="return go('home')">Home</a><a href="/benchmark/" onclick="return go('benchmark')">Benchmark</a><a href="/workbench/" onclick="return go('workbench')">New study</a></div></header><main id="app"></main><footer><span>DOCKLAB · LOCAL DEVELOPMENT</span><span>Docking scores are estimates, not measures of biological activity.</span></footer></div>
<script>
const API='http://localhost:8001/api/v1';let screen=location.pathname.startsWith('/benchmark')?'benchmark':location.pathname.startsWith('/workbench')?'workbench':'home';let examples=[],job=null,target=null,ligands=[],box=null,qc=null,rotation={x:.3,y:.6},drag=null,selected='',currentPdb='',currentPose='',selectedLigand=null,ligandSvgUrl='',structureRequest=0;const searchedStructures=new Map();
const el=(id)=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,init={}){let r;try{const headers=new Headers(init.headers||{});if(typeof init.body==='string'&&!headers.has('Content-Type'))headers.set('Content-Type','application/json');r=await fetch(API+path,{...init,headers})}catch(e){throw Error('DockLab API is not running at localhost:8001. Start the API using the instructions shown below.')}let t=await r.text(),d={};try{d=t?JSON.parse(t):{}}catch{d={message:t}}if(!r.ok)throw Error(d.error?.message||d.detail?.error?.message||d.detail?.message||d.message||r.statusText);return d}
function go(s){screen=s;history.pushState({},'',s==='home'?'/':`/${s}/`);render();return false}window.onpopstate=()=>{screen=location.pathname.startsWith('/benchmark')?'benchmark':location.pathname.startsWith('/workbench')?'workbench':'home';render()};
async function init(){try{examples=(await api('/examples')).examples||[]}catch{}render()}
function render(){const root=el('app');if(screen==='home'){root.innerHTML=`<p class="eyebrow">MOLECULAR DOCKING · LOCAL ANALYSIS</p><h1>Can you trust<br><em>a docking result?</em></h1><p class="lede">Prepare proteins and ligands, inspect the binding box and structure, then run AutoDock Vina with QC and repeatability checks.</p><div class="launch glass"><div><span class="eyebrow">START FROM A PREPARED STUDY</span><label for="target-select">Choose protein target</label><select id="target-select">${examples.map(e=>`<option value="${esc(e.name)}">${esc(e.target.name)} · ${esc(e.target.pdb_id)}</option>`).join('')}</select></div><button onclick="loadExample()">Load study ↗</button></div><p class="msg" id="message"></p><button class="quiet" onclick="newJob()">Create a study with another protein or uploaded files →</button><div class="method"><p class="eyebrow">WORKFLOW</p><p>Prepare receptor and molecules → inspect structure → run QC → dock and report.</p><p>Reliability measures computational repeatability, not biological activity.</p></div>`;return}
if(screen==='benchmark'){root.innerHTML=`<p class="eyebrow">VALIDATION / REPRODUCIBILITY</p><h1>Measure the method,<br><em>then its limits.</em></h1><p class="lede">Compare two separate target-specific screening studies. Active and decoy labels refer to molecules, not proteins. They are defined separately for each target.</p><div class="list">${examples.map(e=>`<article><span class="eyebrow">${esc(e.target.pdb_id)}</span><h3>${esc(e.target.name)}</h3><p class="muted">${esc(e.target.function_summary||'Bundled benchmark target')}</p><button onclick="openStudy('${esc(e.name)}')">Open study →</button></article>`).join('')}</div><section><h2>Archived 1HSG pose validation</h2><div class="grid"><article class="panel"><span class="eyebrow">VINA SCORE</span><h3>−11.556 kcal/mol</h3><p>Archived pose artifact</p></article><article class="panel"><span class="eyebrow">SYMMETRY-AWARE RMSD</span><h3>0.418 Å</h3><p>45 heavy atoms</p></article><article class="panel"><span class="eyebrow">CONTACT RECOVERY</span><h3>78.9%</h3><p>15 of 19 key residues</p></article></div><p class="muted">Archived values are not a fresh reproduction. Fresh screening outputs below are generated by the benchmark runner.</p></section><section><button id="bench-btn" onclick="runBenchmark()">Run two-target benchmark</button><p id="bench-status" class="stats">Loading benchmark status…</p><div id="bench-results"></div><pre id="bench-log" class="report hidden"></pre><a id="bench-report" class="hidden" target="_blank" href="${API}/benchmark/report">Open generated report ↗</a></section>`;pollBenchmark();return}
root.innerHTML=`<p class="eyebrow">LOCAL SCIENCE WORKBENCH</p><h1>Build a study.<br><em>Inspect every step.</em></h1><p class="lede">Search public protein databases, choose an experimental or predicted structure, or upload your own receptor and ligands.</p><section><h2><span>1.</span> Protein and ligand inputs</h2><div class="grid"><article class="panel"><h3>Search public proteins</h3><p>Search by name, gene, UniProt accession, or PDB title. Results are added to Prepared targets.</p><input type="text" id="protein-query" placeholder="e.g. EGFR, insulin, P00533"><button onclick="searchProtein()">Search UniProt + PDB</button><p id="protein-search-status" class="stats">Experimental structures and AlphaFold predictions · no API key</p></article><article class="panel"><h3>Prepared targets</h3><select id="prepared-target-select" onchange="updatePreparedButton()">${preparedOptionsHTML()}</select><button id="prepared-load-btn" onclick="loadExample()">Load target + ligands</button></article><article class="panel"><h3>Fetch another protein</h3><input type="text" id="pdb-id" value="1HSG" maxlength="200" placeholder="PDB ID or RCSB link"><button onclick="fetchProtein()">Fetch and prepare</button><p>Or upload a receptor .pdb / .ent file:</p><input type="file" accept=".pdb,.ent" onchange="uploadProtein(this.files[0])"></article><article class="panel"><h3>Ligand upload</h3><p>CSV columns: name, smiles, label. Or whitespace-separated .smi.</p><input type="file" accept=".csv,.smi,.smiles,.txt" onchange="uploadLigands(this.files[0])"><p id="ligand-count" class="stats">No ligands loaded.</p><div id="ligand-list"></div></article></div><p class="msg" id="message"></p><div id="target-info"></div></section><section><h2><span>2.</span> 3D protein and pose</h2><p class="muted">Drag to rotate the receptor. Choose a result after docking to overlay its pose.</p><div class="structure-grid"><div class="viewer"><canvas id="canvas"></canvas></div><article class="panel"><h3 id="ligand-2d-title">Ligand 2D</h3><p class="stats">2D chemical depiction · selected ligand</p><div id="ligand-2d" class="ligand-drawing">Choose a ligand to draw its 2D structure.</div><div id="ligand-details" class="hit-meta"></div></article></div></section><section><h2><span>3.</span> Search box (Å)</h2><p class="muted">Set center to the binding pocket; uploaded structures start at origin with a 20 Å box.</p><div id="box-fields" class="fields"></div></section><section><h2><span>4.</span> Pre-docking QC</h2><button onclick="runQC()" id="qc-btn" disabled>Run QC checks</button><div id="qc-result"></div></section><section><h2><span>5.</span> Docking</h2><p class="stats" id="job-status">Create or load a study first.</p><button onclick="runDock()" id="run-btn" disabled>Start docking + reliability ↗</button></section><section><h2><span>6.</span> Results and reports</h2><div id="results"><p class="muted">Run docking to populate results and report links.</p></div></section>`;renderTarget();renderLigands();renderBox();renderViewer();refreshJob()}
async function openStudy(name){await loadExample(name);go('workbench')}
function preparedOptionsHTML(){return examples.map(e=>`<option value="example:${esc(e.name)}">${esc(e.target.name)} · ${esc(e.target.pdb_id)} · bundled study</option>`).join('')+[...searchedStructures].map(([key,h])=>`<option value="remote:${esc(key)}">${esc(h.name)} · ${esc(h.kind==='predicted'?'AlphaFold':h.pdb_id)}</option>`).join('')}
function updatePreparedButton(){const select=el('prepared-target-select'),button=el('prepared-load-btn');if(select&&button)button.textContent=select.value.startsWith('remote:')?'Prepare selected protein':'Load target + ligands'}
async function loadExample(name){name=name||document.querySelector('#prepared-target-select')?.value||document.querySelector('#target-select')?.value;if(!name)return;if(name.startsWith('remote:'))return prepareCandidate(name.slice(7));name=name.replace(/^example:/,'');try{const d=await api(`/examples/${encodeURIComponent(name)}/load`,{method:'POST'}),x=await api(`/examples/${encodeURIComponent(name)}`);job=d.job;target=d.target;box=d.job.box;ligands=x.ligands;selectedLigand=null;currentPose='';qc=null;render();setMsg(`Loaded ${d.ligand_count} screening molecules for ${target.name}.`);if(screen==='home')go('workbench')}catch(e){setMsg(e.message)}}
async function newJob(){try{job=await api('/jobs',{method:'POST'});target=null;ligands=[];selectedLigand=null;currentPose='';qc=null;box={center:{x:0,y:0,z:0},size:{x:20,y:20,z:20}};go('workbench');setMsg('New study created. Add a protein and ligand inputs.')}catch(e){setMsg(e.message)}}
function setMsg(s){const m=el('message');if(m)m.textContent=s;else alert(s)}
function renderTarget(){if(!el('target-info'))return;if(!target){el('target-info').innerHTML='';return}const count=label=>ligands.filter(x=>(x.label||'').toLowerCase()===label).length;const links=[target.source_url&&`<a target="_blank" rel="noreferrer" href="${esc(target.source_url)}">${esc(target.source||'Structure source')} ↗</a>`,target.uniprot_id&&`<a target="_blank" rel="noreferrer" href="https://www.uniprot.org/uniprotkb/${encodeURIComponent(target.uniprot_id)}/entry">UniProt ↗</a>`,target.co_crystallized_ligand?.residue_name&&`<a target="_blank" rel="noreferrer" href="https://pdbj.org/chemie/pdb/${encodeURIComponent(target.co_crystallized_ligand.residue_name)}">PDBj Chemie ${esc(target.co_crystallized_ligand.residue_name)} ↗</a>`].filter(Boolean).join(' · ');el('target-info').innerHTML=`<article class="panel target-card"><span class="eyebrow">CURRENT TARGET · ${esc(target.pdb_id||'uploaded')}</span><h3>${esc(target.name||target.title||target.pdb_id||'Protein structure')}</h3><p>${esc(target.function_summary||'No curated functional summary is available for this structure.')}</p><p class="hit-meta">${esc(target.organism||'Organism not supplied')} · ${esc(target.structure_type||'structure')}${target.method?` · ${esc(target.method)}`:''}${target.resolution?` · ${esc(target.resolution)} Å`:''}${target.uniprot_id?` · UniProt ${esc(target.uniprot_id)}`:''}${target.chain_ids?.length?` · chains ${esc(target.chain_ids.join(', '))}`:''}</p>${links?`<p>${links}</p>`:''}<div class="case-explainer"><b>Screening set for this study</b><p>${count('active')} active compounds and ${count('decoy')} decoys are loaded. These labels describe small molecules, not proteins. Actives are known binders for this target; decoys are comparison molecules expected to be inactive. The counts change with the selected case study. A searched protein starts with no labeled set: upload ligands to dock it.</p></div></article>`}
function renderLigands(){if(el('ligand-count'))el('ligand-count').textContent=`${ligands.length} molecule records loaded.`;const list=el('ligand-list');if(list)list.innerHTML=ligands.map((m,i)=>`<button class="protein-hit" onclick="selectLigand(${i})">${esc(m.name)} <span class="hit-meta">${esc(m.label||'molecule')}</span></button>`).join('');if(el('qc-btn'))el('qc-btn').disabled=!job||!box||!ligands.length;if(ligands.length&&(!selectedLigand||!ligands.includes(selectedLigand)))selectLigand(0)}
async function selectLigand(i){const m=typeof i==='number'?ligands[i]:ligands.find(x=>x.name===i);if(!m)return;selectedLigand=m;if(el('ligand-2d-title'))el('ligand-2d-title').textContent=`${m.name} · 2D`;const boxEl=el('ligand-2d');if(!boxEl)return;try{const d=await api('/ligands/summary',{method:'POST',body:JSON.stringify({smiles:m.smiles,name:m.name})});if(ligandSvgUrl)URL.revokeObjectURL(ligandSvgUrl);ligandSvgUrl=URL.createObjectURL(new Blob([d.svg],{type:'image/svg+xml'}));boxEl.innerHTML=`<img alt="2D structure of ${esc(m.name)}" src="${ligandSvgUrl}">`;const details=el('ligand-details');if(details)details.innerHTML=`<p><b>${esc(d.formula)}</b> · ${esc(d.molecular_weight)} Da · charge ${esc(d.formal_charge)} · ${esc(d.atom_count)} atoms</p><p>Canonical SMILES<br><code>${esc(d.canonical_smiles)}</code></p>`}catch(e){boxEl.textContent=m.smiles?'2D depiction unavailable: '+e.message:'This ligand has no SMILES string for 2D depiction.';if(el('ligand-details'))el('ligand-details').textContent=''} }
function renderBox(){if(!el('box-fields'))return;box=box||{center:{x:0,y:0,z:0},size:{x:20,y:20,z:20}};el('box-fields').innerHTML=[...['x','y','z'].map(a=>`<label>${a.toUpperCase()} center<input type="number" step="0.1" value="${box.center[a]}" onchange="setBox('${a}','center',this.value)"></label>`),...['x','y','z'].map(a=>`<label>${a.toUpperCase()} size<input type="number" min="1" max="30" step="0.1" value="${box.size[a]}" onchange="setBox('${a}','size',this.value)"></label>`)].join('')}
function setBox(a,k,v){box[k][a]=Number(v)}
async function searchProtein(){const q=el('protein-query')?.value.trim();if(!q)return setMsg('Enter a protein name, gene, UniProt accession, or PDB title.');const status=el('protein-search-status');if(status)status.textContent='Searching UniProt, RCSB PDB and AlphaFold…';try{const d=await api(`/proteins/search?q=${encodeURIComponent(q)}&limit=12&include_predicted=true`);const hits=[...(d.structures||[]),...(d.predicted_models||[])];const newKeys=[];for(const h of hits){const key=h.kind==='predicted'?`af-${h.accession}`:`pdb-${h.id||h.pdb_id+'_'+(h.entity_id||'')}`;searchedStructures.set(key,h);newKeys.push(key)}const select=el('prepared-target-select');if(select){const previous=select.value;select.innerHTML=preparedOptionsHTML();select.value=newKeys.length?`remote:${newKeys[0]}`:previous;updatePreparedButton()}if(status)status.textContent=hits.length?`${hits.length} structures added to Prepared targets. Choose one there, then select Prepare.`:(d.proteins||[]).length?`Protein records found, but no coordinate structures matched. Try a UniProt accession or another search term.`:'No structures found. Try a gene symbol, UniProt accession, or PDB ID.';if(d.warnings?.length&&status)status.textContent+=` Some database sources unavailable: ${d.warnings.join('; ')}`}catch(e){if(status)status.textContent=e.message}}
async function prepareCandidate(key){const h=searchedStructures.get(key);if(!h)return setMsg('Select a protein from the Prepared targets list.');try{const previousJob=job;job=await api('/jobs',{method:'POST'});let d;if(h.kind==='predicted')d=await api(`/jobs/${job.id}/protein/alphafold`,{method:'POST',body:JSON.stringify({accession:h.accession,target:h})});else d=await api(`/jobs/${job.id}/protein`,{method:'POST',body:JSON.stringify({pdb_id:h.pdb_id,chain_ids:h.chain_ids,target:h})});target={...h,...d,name:h.name||h.title,pdb_id:h.pdb_id||h.accession,function_summary:h.function_summary||`${h.kind==='predicted'?'AlphaFold predicted':'Experimental'} structure`};ligands=[];selectedLigand=null;currentPose='';qc=null;box={center:{x:0,y:0,z:0},size:{x:20,y:20,z:20}};render();setMsg(`Prepared ${target.name}. Add a target-specific ligand set before running QC.`)}catch(e){job=null;setMsg(e.message)}}
async function fetchProtein(){const button=document.querySelector('#pdb-id')?.nextElementSibling;try{const input=el('pdb-id').value.trim();let id=input.toUpperCase();if(!/^[A-Z0-9]{4}$/.test(id)){try{const url=new URL(input);const match=url.pathname.match(/\/(?:structure|download)\/([A-Z0-9]{4})(?:\.PDB)?(?:\/|$)/i);if(match)id=match[1].toUpperCase()}catch{} }if(!/^[A-Z0-9]{4}$/.test(id))throw Error('Enter a four-character PDB ID (for example, 1CRN) or paste its RCSB structure/download link.');if(button){button.disabled=true;button.textContent=`Fetching ${id}…`}setMsg(`Downloading ${id} from RCSB and preparing its receptor…`);const draft=await api('/jobs',{method:'POST'});const d=await api(`/jobs/${draft.id}/protein`,{method:'POST',body:JSON.stringify({pdb_id:id})});job=draft;target={...d,pdb_id:d.pdb_id,name:d.name||d.title||`PDB ${d.pdb_id}`,function_summary:d.function_summary||'No curated functional summary is available for this structure.'};ligands=[];selectedLigand=null;currentPose='';qc=null;box={center:{x:0,y:0,z:0},size:{x:20,y:20,z:20}};render();setMsg(`Prepared ${target.name}. Add ligands for this target before running QC.`)}catch(e){setMsg(e.message)}finally{const current=document.querySelector('#pdb-id')?.nextElementSibling;if(current){current.disabled=false;current.textContent='Fetch and prepare'}}}
async function uploadProtein(f){if(!f)return;try{if(!job)job=await api('/jobs',{method:'POST'});const d=await api(`/jobs/${job.id}/protein/upload`,{method:'POST',headers:{'X-Filename':f.name,'Content-Type':'application/octet-stream'},body:f});target={...d,pdb_id:d.pdb_id,name:f.name,function_summary:'Uploaded and prepared receptor'};ligands=[];selectedLigand=null;currentPose='';qc=null;box={center:{x:0,y:0,z:0},size:{x:20,y:20,z:20}};render();setMsg('Protein prepared. Add target-specific ligands, then enter the binding-pocket center before QC.')}catch(e){setMsg(e.message)}}
async function uploadLigands(f){if(!f)return;try{if(!job)throw Error('Create a study first.');const d=await api(`/jobs/${job.id}/ligands/upload`,{method:'POST',headers:{'X-Filename':f.name,'Content-Type':'application/octet-stream'},body:f});ligands=d.molecules;selectedLigand=null;renderLigands();renderTarget();setMsg(`Loaded ${ligands.length} ligand molecules for ${target?.name||'this target'}.`)}catch(e){setMsg(e.message)}}
async function runQC(){if(!job||!target||!ligands.length)return setMsg('Load a prepared target and add at least one ligand before QC.');const usable=ligands.filter(x=>x.smiles?.trim());if(!usable.length)return setMsg('No ligand has a SMILES string. Upload a CSV with name,smiles,label or an .smi file.');const button=el('qc-btn');if(button)button.disabled=true;setMsg('Running protein, ligand, and search-box QC…');try{const prepared=await api(`/jobs/${job.id}/ligands`,{method:'POST',body:JSON.stringify({ligands:usable.map(x=>({name:x.name,smiles:x.smiles,label:['active','decoy'].includes((x.label||'').toLowerCase())?x.label.toLowerCase():'unknown'}))})});ligands=prepared.molecules;selectedLigand=null;await api(`/jobs/${job.id}/box`,{method:'PUT',body:JSON.stringify({center:box.center,size:box.size})});qc=await api(`/jobs/${job.id}/qc`,{method:'POST'});const needsAck=!!qc.requires_acknowledgement;el('qc-result').innerHTML=`<p><b>${esc(qc.summary||'QC complete')}</b></p><div class="checks">${(qc.checks||[]).map(c=>`<div class="check"><b>${esc((c.severity||'info').toUpperCase())}</b><div><strong>${esc(c.title)}</strong><p>${esc(c.detail)}</p></div></div>`).join('')}</div>${needsAck?'<label><input id="ack" type="checkbox" onchange="updateRunButton()"> I reviewed and acknowledge the QC findings</label>':''}`;renderLigands();renderTarget();updateRunButton();setMsg('QC complete. Review findings before docking.')}catch(e){qc=null;el('qc-result').innerHTML=`<p class="msg">QC could not complete: ${esc(e.message)}</p>`;setMsg(e.message);updateRunButton()}finally{if(button)button.disabled=!job||!target||!ligands.length}}
function updateRunButton(){const b=el('run-btn');if(b)b.disabled=!job||!target||!qc||!!qc.requires_acknowledgement&&!el('ack')?.checked} 
async function runDock(){if(!job||!qc)return setMsg('Run pre-docking QC first.');try{const runButton=el('run-btn');if(runButton)runButton.disabled=true;await api(`/jobs/${job.id}/settings`,{method:'PUT',body:JSON.stringify({exhaustiveness:8,seed:42,reliability:true,top_k:10,n_seeds:5})});await api(`/jobs/${job.id}/run`,{method:'POST',body:JSON.stringify({acknowledge_qc_failures:!!el('ack')?.checked})});el('results').innerHTML='<p class="stats">Docking is running. Per-molecule status will appear when it finishes.</p>';setMsg('Docking queued. Progress is shown in section 5.');pollJob()}catch(e){setMsg(e.message);updateRunButton()}}
async function pollJob(){if(!job)return;const activeJob=job.id;try{const s=await api('/jobs/'+activeJob);if(job?.id!==activeJob)return;el('job-status').textContent='Job '+activeJob.slice(0,8)+' · '+s.status+' · '+(s.progress?.done||0)+'/'+(s.progress?.total||0)+(s.error_message?' · '+s.error_message:'');if((s.progress?.done||0)>0){const d=await api('/jobs/'+activeJob+'/results');if(job?.id===activeJob)renderResults(d)}if(['completed','failed','cancelled'].includes(s.status)){const d=await api('/jobs/'+activeJob+'/results');if(job?.id===activeJob)renderResults(d);if(s.status==='failed')setMsg(s.error_message||'Docking failed. See failed molecule details in section 6.');return}}catch(e){setMsg('Unable to refresh job status: '+e.message)}setTimeout(()=>{if(job?.id===activeJob)pollJob()},2500)}
function refreshJob(){const status=el('job-status');if(status)status.textContent=job?`Job ${job.id.slice(0,8)} · ${job.status||'created'}`:'Create or load a study first.';const q=el('qc-btn');if(q)q.disabled=!job||!target||!ligands.length;updateRunButton()}
function renderResults(d){const rows=d.results||[],analysis=d.analysis;const metricHtml=analysis?`<article class="panel"><b>Screening metrics</b><p>ROC-AUC ${analysis.roc_auc?.toFixed?.(3)??'—'} · EF5 ${analysis.ef5?.toFixed?.(2)??'—'} · actives ${analysis.actives??'—'} · decoys ${analysis.decoys??'—'}</p><p class="hit-meta">These metrics compare labeled molecules within this target's screening set. They are not binding probabilities.</p></article>`:'';const table=rows.length?`<div class="scroll"><table><thead><tr><th>Rank</th><th>Molecule</th><th>Dataset label</th><th>Score</th><th>Reliability</th><th>Status / details</th><th>Pose</th></tr></thead><tbody>${rows.map(r=>`<tr class="row" ${r.sdf?`onclick="showPose('${esc(r.name)}')"`:''}><td>${r.rank??'—'}</td><td>${esc(r.name)}</td><td>${esc(r.label||'unknown')}</td><td>${r.score!=null?Number(r.score).toFixed(2):'—'}</td><td>${esc(r.reliability?.label||'—')}</td><td>${esc(r.status||'')}${r.error?` · ${esc(r.error)}`:''}</td><td>${r.sdf?'View pose':'—'}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Docking returned no molecule records.</p>';el('results').innerHTML=`${metricHtml}${table}<div class="links"><a target="_blank" href="${API}/jobs/${job.id}/export?type=html">Target-specific HTML report ↗</a><a href="${API}/jobs/${job.id}/export?type=pdf">PDF report ↗</a><a href="${API}/jobs/${job.id}/export?type=csv">CSV results ↗</a><a href="${API}/jobs/${job.id}/export?type=zip">Study archive ↗</a></div>`}
function renderViewer(){const c=el('canvas');if(!c)return;bindCanvas();const requestId=++structureRequest;currentPdb='';currentPose='';rotation={x:.3,y:.6};if(!job){drawPdb('');return}const activeJob=job.id;drawPdb('');fetch(`${API}/jobs/${encodeURIComponent(activeJob)}/structure`).then(async r=>{if(!r.ok)throw Error(`Structure request failed (${r.status}).`);return r.text()}).then(pdb=>{if(requestId!==structureRequest||job?.id!==activeJob)return;currentPdb=pdb;drawPdb(currentPdb,currentPose)}).catch(e=>{if(requestId!==structureRequest)return;drawPdb('');const ctx=c.getContext('2d');ctx.fillStyle='#a63a28';ctx.font='12px monospace';ctx.fillText(e.message,18,54)})}
function drawPdb(pdb,pose=''){const c=el('canvas');if(!c)return;const ctx=c.getContext('2d'),dpr=devicePixelRatio||1,rect=c.getBoundingClientRect();c.width=rect.width*dpr;c.height=rect.height*dpr;ctx.scale(dpr,dpr);ctx.fillStyle='#faf9f4';ctx.fillRect(0,0,rect.width,rect.height);const lines=pdb.split(/\r?\n/).filter(x=>x.startsWith('ATOM  ')||x.startsWith('HETATM'));const stride=Math.max(1,Math.ceil(lines.length/6000));let atoms=lines.filter((_,i)=>i%stride===0).map(l=>({x:+l.slice(30,38),y:+l.slice(38,46),z:+l.slice(46,54),e:(l.slice(76,78).trim()||'C').toUpperCase(),lig:false}));if(pose){const ls=pose.split(/\r?\n/),n=parseInt(ls[3]?.slice(0,3)||'0');atoms=atoms.concat(ls.slice(4,4+n).map(l=>({x:+l.slice(0,10),y:+l.slice(10,20),z:+l.slice(20,30),e:l.slice(31,34).trim()||'C',lig:true})))}if(!atoms.length){ctx.fillStyle='#777';ctx.fillText(job?'Loading prepared structure…':'Load a prepared structure to display its 3D coordinates.',18,30);return}const cr=Math.cos(rotation.x),sr=Math.sin(rotation.x),cy=Math.cos(rotation.y),sy=Math.sin(rotation.y),ps=atoms.map(a=>{let x=a.x*cy-a.z*sy,z=a.x*sy+a.z*cy,y=a.y*cr-z*sr;return {...a,px:x,py:y,depth:a.y*sr+z*cr}}),minX=Math.min(...ps.map(a=>a.px)),maxX=Math.max(...ps.map(a=>a.px)),minY=Math.min(...ps.map(a=>a.py)),maxY=Math.max(...ps.map(a=>a.py)),scale=Math.min((rect.width-36)/(maxX-minX||1),(rect.height-36)/(maxY-minY||1));ps.sort((a,b)=>a.depth-b.depth).forEach(a=>{const x=(a.px-(minX+maxX)/2)*scale+rect.width/2,y=(a.py-(minY+maxY)/2)*scale+rect.height/2;ctx.globalAlpha=a.lig?1:.52;ctx.fillStyle=a.lig?'#a63a28':({C:'#37434b',N:'#4d6da8',O:'#b44e43',S:'#bd9a3d'}[a.e]||'#999');ctx.beginPath();ctx.arc(x,y,a.lig?4:2,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;ctx.fillStyle='#777';ctx.font='10px monospace';ctx.fillText('DRAG TO ROTATE · RED = DOCKED LIGAND',12,rect.height-12)}
async function showPose(name){try{selected=name;currentPose=await fetch(`${API}/jobs/${job.id}/molecules/${encodeURIComponent(name)}/poses/1`).then(r=>{if(!r.ok)throw Error();return r.text()});drawPdb(currentPdb,currentPose);document.querySelector('.viewer').scrollIntoView({behavior:'smooth'})}catch(e){setMsg('Pose is not available yet.')}}
function bindCanvas(){const c=el('canvas');if(!c)return;c.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY};c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(drag){rotation.y+=(e.clientX-drag.x)*.01;rotation.x+=(e.clientY-drag.y)*.01;drag={x:e.clientX,y:e.clientY};drawPdb(currentPdb,currentPose)}};c.onpointerup=()=>drag=null}
async function runBenchmark(){el('bench-btn').disabled=true;try{await api('/benchmark',{method:'POST',body:JSON.stringify({target:'all',exhaustiveness:4,seed:42})});pollBenchmark()}catch(e){el('bench-status').textContent=e.message;el('bench-btn').disabled=false}}
async function pollBenchmark(){try{const d=await api('/benchmark');el('bench-status').textContent=`Status: ${d.status}${d.target?' · '+d.target:''}`;if(d.log){el('bench-log').classList.remove('hidden');el('bench-log').textContent=d.log}if(d.results){el('bench-results').innerHTML=`<div class="scroll"><table><thead><tr><th>Target</th><th>Status</th><th>Docked</th><th>ROC-AUC</th><th>EF5</th></tr></thead><tbody>${d.results.map(r=>`<tr><td>${esc(r.target)}</td><td>${esc(r.status)}</td><td>${r.docked_count??'—'}</td><td>${r.screening?.roc_auc?.toFixed?.(3)??'—'}</td><td>${r.screening?.ef5?.toFixed?.(2)??'—'}</td></tr>`).join('')}</tbody></table></div>`}if(d.status==='completed')el('bench-report').classList.remove('hidden');if(d.status==='running')setTimeout(pollBenchmark,5000);else el('bench-btn').disabled=false}catch(e){el('bench-status').textContent=e.message;el('bench-btn').disabled=false}}
init();
</script></body></html>
